{% extends "catalog/base.html" %}

{% block content %}

<div class="container mt-3">

    <h1>{{ blog.title }}</h1>

    {% if blog.preview %}
        <img src="{{ blog.preview.url }}" style="max-width:300px;">
    {% endif %}

    <p class="mt-3">
        {{ blog.content }}
    </p>

    <p>Просмотры: {{ blog.views_count }}</p>

    <a href="{% url 'blog:update' blog.pk %}" class="btn btn-warning">
        Редактировать
    </a>

    <a href="{% url 'blog:delete' blog.pk %}" class="btn btn-danger">
        Удалить
    </a>

</div>

{% endblock %}
