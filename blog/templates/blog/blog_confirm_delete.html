{% extends "catalog/base.html" %}

{% block content %}

<div class="container mt-3">

    <h1>Удалить статью?</h1>

    <p>{{ blog.title }}</p>

    <form method="post">

        {% csrf_token %}

        <button class="btn btn-danger">
            Да удалить
        </button>

        <a href="{% url 'blog:detail' blog.pk %}" class="btn btn-secondary">
            Отмена
        </a>

    </form>

</div>

{% endblock %}
