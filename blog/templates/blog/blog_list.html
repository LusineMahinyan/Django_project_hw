{% extends "catalog/base.html" %}

{% block content %}

<div class="container mt-3">

    <h1>Блог</h1>

    <a href="{% url 'blog:create' %}" class="btn btn-primary mb-3">
        Добавить статью
    </a>

    {% for blog in blogs %}

        <div class="card mb-3">

            <div class="card-body">

                <h3>
                    <a href="{% url 'blog:detail' blog.pk %}">
                        {{ blog.title }}
                    </a>
                </h3>

                <p>
                    {{ blog.content|truncatechars:150 }}
                </p>

            </div>

        </div>

    {% empty %}

        <p>Статей пока нет</p>

    {% endfor %}

</div>

{% endblock %}
