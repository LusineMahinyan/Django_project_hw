{% extends "catalog/base.html" %}

{% block content %}

<div class="container mt-3">

    <h2>Удаление товара</h2>

    <p>
        Вы действительно хотите удалить
        "{{ product.name }}"?
    </p>

    <form method="post">

        {% csrf_token %}

        <button
            type="submit"
            class="btn btn-danger"
        >
            Удалить
        </button>

        <a
            href="{% url 'catalog:product_detail' product.pk %}"
            class="btn btn-secondary"
        >
            Отмена
        </a>

    </form>

</div>

{% endblock %}
