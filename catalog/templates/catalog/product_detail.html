{% extends "catalog/base.html" %}

{% block content %}

<div class="container">

    <h1>{{ product.name }}</h1>

    {% if product.image %}

        <img src="{{ product.image.url }}"
             width="300">

    {% endif %}

    <p>

        {{ product.description }}

    </p>

    <h3>

        {{ product.price }}

    </h3>

    <a href="{% url 'catalog:home' %}"
       class="btn btn-primary">

        На главную

    </a>

</div>

{% endblock %}
