{% extends "catalog/base.html" %}

{% block content %}

<div class="container">

    <div class="row">

        {% for product in products %}

        <div class="col-4">

            <div class="card">

                {% if product.image %}

                    <img src="{{ product.image.url }}"
                         class="card-img-top">

                {% endif %}

                <div class="card-body">

                    <h5>

                        {{ product.name }}

                    </h5>

                    <p>

                        {{ product.description|truncatechars:100 }}

                    </p>

                    <p>

                        {{ product.price }}

                    </p>

                    <a href="{% url 'catalog:product_detail' product.pk %}"
                       class="btn btn-primary">

                        Подробнее

                    </a>

                </div>

            </div>

        </div>

        {% endfor %}

    </div>

</div>

{% endblock %}
